<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g fill="#000000">
    <!-- Head -->
    <circle cx="218" cy="88" r="36"/>
    <!-- Batting helmet dome -->
    <path d="M180,88 C180,44 256,44 256,84 L252,96 C238,88 226,86 218,86 C210,86 198,88 180,96 Z"/>
    <!-- Helmet bill (pointing left toward pitcher) -->
    <path d="M180,96 L178,112 L144,118 L142,102 Z"/>
    <!-- Ear guard -->
    <ellipse cx="184" cy="105" rx="12" ry="21"/>
    <!-- Neck -->
    <rect x="205" y="120" width="24" height="32" rx="5"/>
    <!-- Torso (wider at shoulders, tapers to hips) -->
    <path d="M150,152 C137,160 133,180 138,214 L142,289 C144,308 161,320 188,320 L250,320 C278,320 294,308 296,289 L300,214 C305,178 296,154 282,152 Z"/>
    <!-- Right arm (bat arm — raised, cocked behind shoulder) -->
    <path d="M280,157 C296,150 320,160 333,183 L350,220 C356,238 347,258 330,260 L310,262 C292,262 281,248 278,230 L265,192 C260,167 264,162 280,157 Z"/>
    <!-- Left arm (front/guiding arm) -->
    <path d="M152,157 C138,157 120,172 114,193 L106,222 C102,242 113,258 131,258 L150,258 C168,258 176,244 177,227 L179,196 C181,172 165,156 152,157 Z"/>
    <!-- Bat grip connector — links both hands at the handle -->
    <path d="M142,251 L316,259 L316,275 L142,267 Z"/>
    <!-- Bat — tapered from grip up-right to barrel tip -->
    <path d="M310,254 L324,266 L450,76 C456,66 468,68 466,80 L458,95 C455,102 450,106 445,109 L322,280 L308,268 Z"/>
    <!-- Right leg (back, planted) -->
    <path d="M250,318 C260,340 270,370 274,399 L277,442 C279,463 270,478 255,480 L236,482 C219,482 210,468 208,450 L206,416 C205,386 212,357 220,331 L225,318 Z"/>
    <!-- Left leg (front/stride) -->
    <path d="M188,318 C179,342 168,372 162,399 L153,442 C149,464 154,479 169,481 L191,483 C208,483 218,469 219,450 L222,416 C225,386 225,357 225,331 L227,318 Z"/>
    <!-- Right cleat -->
    <ellipse cx="242" cy="477" rx="34" ry="12"/>
    <!-- Left cleat -->
    <ellipse cx="186" cy="479" rx="34" ry="12"/>
  </g>
</svg>
