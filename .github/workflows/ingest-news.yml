name: Ingest YATSTATS News

# Pilot: daily Webz.io news for the schools in NEWS_HSIDS only (Hamilton
# today). Each school costs Webz.io calls from the 1,000/month free plan,
# so adding one is a deliberate change here - there is no all-schools mode.

on:
  schedule:
    # Daily, ~5:45 AM Arizona time.
    - cron: "47 12 * * *"
  workflow_dispatch:
    inputs:
      hsid:
        description: "School hsid(s), comma-separated. Blank = NEWS_HSIDS below (Hamilton, 5004)."
        required: false
        default: ""
      dry_run:
        description: "Preview only; do not write news_articles rows"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  ingest-news:
    name: Ingest alumni news from Webz.io
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WEBZ_API_TOKEN: ${{ secrets.WEBZ_API_TOKEN }}
      # Schools with news turned on.
      NEWS_HSIDS: "5004"
      # Stop when Webz.io reports fewer calls than this left for the month.
      NEWS_MIN_REQUESTS_LEFT: "100"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runtime dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save tsx @types/node

      - name: Ingest news
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.hsid }}" ]; then
            ARGS="$ARGS --hsid ${{ github.event.inputs.hsid }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx scripts/ingest-news.ts $ARGS
