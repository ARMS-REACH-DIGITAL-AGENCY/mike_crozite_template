name: Import Images to S3

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without uploading to S3"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      limit:
        description: "Only process first N rows (0 = all)"
        required: true
        default: "0"
      repo_url:
        description: "Source GitHub repo URL"
        required: true
        default: "https://github.com/yatstats/hamilton-mvp.git"
      branch:
        description: "Source repo branch"
        required: true
        default: "main"
      csv_path:
        description: "Path to mapping CSV inside this repo"
        required: true
        default: "data/image-mapping.csv"
      bucket:
        description: "Target S3 bucket"
        required: true
        default: "yatstats-assets"
      region:
        description: "AWS region"
        required: true
        default: "us-west-2"
      prefix:
        description: "Optional S3 prefix (example: staging/)"
        required: false
        default: ""

jobs:
  import-images:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ github.event.inputs.region }}

    steps:
      - name: Checkout mike_crozite_template repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas pillow

      - name: Verify required files exist
        run: |
          test -f scripts/import_hamilton_mvp_images_to_s3.py
          test -f "${{ github.event.inputs.csv_path }}"
          echo "Script and CSV found."

      - name: Dry run import
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          python scripts/import_hamilton_mvp_images_to_s3.py \
            --csv "${{ github.event.inputs.csv_path }}" \
            --repo-url "${{ github.event.inputs.repo_url }}" \
            --branch "${{ github.event.inputs.branch }}" \
            --bucket "${{ github.event.inputs.bucket }}" \
            --region "${{ github.event.inputs.region }}" \
            --prefix "${{ github.event.inputs.prefix }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --dry-run

      - name: Real upload to S3
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python scripts/import_hamilton_mvp_images_to_s3.py \
            --csv "${{ github.event.inputs.csv_path }}" \
            --repo-url "${{ github.event.inputs.repo_url }}" \
            --branch "${{ github.event.inputs.branch }}" \
            --bucket "${{ github.event.inputs.bucket }}" \
            --region "${{ github.event.inputs.region }}" \
            --prefix "${{ github.event.inputs.prefix }}" \
            --limit "${{ github.event.inputs.limit }}"

      - name: Upload import report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamilton-mvp-import-report
          path: hamilton_mvp_import_report.csv
          if-no-files-found: ignore
