name: Fetch HS Logos to S3

# Finds a logo for each bracket school with no schools/{hsid}.png, matching it
# through the MaxPreps school sitemap (state, city, name, mascot). See
# scripts/fetch_hs_logos.py. Never overwrites an existing logo.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = report only; stage = all to schools-candidates/; publish = confident matches to schools/, the rest staged"
        required: true
        default: "dry_run"
        type: choice
        options:
          - "dry_run"
          - "stage"
          - "publish"
      limit:
        description: "Only process the first N missing schools (0 = all)"
        required: true
        default: "10"
      hsids:
        description: "Optional comma-separated hsids to run instead of all missing"
        required: false
        default: ""
      csv_path:
        description: "Path to schools CSV inside this repo"
        required: true
        default: "data/hsid_for_Claude.csv"

jobs:
  fetch-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests pillow numpy scipy

      - name: Find and save logos
        run: |
          python scripts/fetch_hs_logos.py \
            --csv "${{ github.event.inputs.csv_path }}" \
            --mode "${{ github.event.inputs.mode }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --hsids "${{ github.event.inputs.hsids }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logos-report
          path: |
            fetch_logos.log
            logo_report.csv
            logo_review.html
          if-no-files-found: ignore
