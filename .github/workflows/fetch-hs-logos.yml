name: Fetch HS Logos to S3

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without uploading to S3"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      limit:
        description: "Only process first N schools (0 = all)"
        required: true
        default: "10"
      csv_path:
        description: "Path to schools CSV inside this repo"
        required: true
        default: "data/hsid_for_Claude.csv"
      bucket:
        description: "Target S3 bucket"
        required: true
        default: "yatstats-assets"
      prefix:
        description: "S3 prefix"
        required: true
        default: "schools/"
      region:
        description: "AWS region"
        required: true
        default: "us-west-2"

jobs:
  fetch-logos:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ github.event.inputs.region }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests

      - name: Verify required files exist
        run: |
          test -f scripts/fetch_hs_logos.py
          test -f "${{ github.event.inputs.csv_path }}"
          echo "Script and CSV found."

      - name: Dry run (no upload)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          python scripts/fetch_hs_logos.py \
            --csv "${{ github.event.inputs.csv_path }}" \
            --bucket "${{ github.event.inputs.bucket }}" \
            --prefix "${{ github.event.inputs.prefix }}" \
            --region "${{ github.event.inputs.region }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --dry-run

      - name: Fetch and upload logos to S3
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python scripts/fetch_hs_logos.py \
            --csv "${{ github.event.inputs.csv_path }}" \
            --bucket "${{ github.event.inputs.bucket }}" \
            --prefix "${{ github.event.inputs.prefix }}" \
            --region "${{ github.event.inputs.region }}" \
            --limit "${{ github.event.inputs.limit }}"

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logos-report
          path: |
            fetch_logos.log
            failed_logos.csv
          if-no-files-found: ignore
