name: Easter-NEWS protection
on:
  pull_request:
    branches: [Easter-NEWS]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: read
jobs:
  integration-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject stale PR branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin Easter-NEWS --no-tags
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "::error::This PR does not contain current Easter-NEWS. Update/rebase the branch and rerun checks."
            exit 1
          fi
      - name: Protected source contracts
        run: node scripts/verify-production-contracts.mjs
