name: Process Team Logo Cutouts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan only; do not create/update cutout outputs"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      in_place:
        description: "Overwrite the original logo at the same S3 key instead of writing to the staging prefix. Only use this after reviewing staged output_prefix results."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      overwrite:
        description: "Overwrite an output that already exists at the destination key (ignored when in_place=true, which always overwrites)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_files:
        description: "Optional max files to process/test. Leave blank for all. Ignored if source_key is set."
        required: false
        default: ""
      source_key:
        description: "Optional exact single S3 key to test (e.g. teams/14134.png), instead of scanning source_prefix"
        required: false
        default: ""
      source_prefix:
        description: "S3 source prefix containing original team logo PNGs"
        required: false
        default: "teams/"
      output_prefix:
        description: "S3 staging prefix for cutout output (ignored when in_place=true)"
        required: false
        default: "teams/cutouts/"

jobs:
  process-team-logo-cutouts:
    name: Process S3 team logo cutouts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      YATSTATS_S3_BUCKET: yatstats-assets
      YATSTATS_S3_SOURCE_PREFIX: ${{ github.event.inputs.source_prefix || 'teams/' }}
      YATSTATS_S3_SOURCE_KEY: ${{ github.event.inputs.source_key || '' }}
      YATSTATS_S3_OUTPUT_PREFIX: ${{ github.event.inputs.output_prefix || 'teams/cutouts/' }}
      IN_PLACE: ${{ github.event.inputs.in_place || 'false' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      OVERWRITE: ${{ github.event.inputs.overwrite || 'false' }}
      MAX_FILES: ${{ github.event.inputs.max_files || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image processing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow rembg onnxruntime

      - name: Process team logo cutouts from S3
        run: python scripts/process-team-logo-cutouts-s3.py
