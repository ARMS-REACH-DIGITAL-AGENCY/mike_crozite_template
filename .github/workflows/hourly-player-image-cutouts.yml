name: Player Image Cutouts

# Pete, Nov 17 2026: never look at every photo to find the few that need work.
#
# Every 30 minutes (cheap): one S3 listing of the marker folder
# cutout-queue/v1/, where the site leaves one marker per approved photo the
# instant cutout (remove.bg) could not handle. Nothing waiting -> the run
# stops after that listing, before installing anything. Something waiting ->
# scripts/process-cutout-queue-s3.py cuts out ONLY those photos, builds their
# web versions in the same run and removes their markers.
#
# Once a day (safety sweep): photos that arrive outside the upload form
# (imports, scripts) have no marker. The sweep compares each folder's listing
# with its cutout folder's listing (dates come from the listings, no
# per-file request) and cuts out only photos that are new or replaced.
#
# workflow_dispatch runs the marker queue by hand; process-player-cutouts.yml
# stays for a one-off custom folder or dry run.

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "41 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: player-cutout-processing
  cancel-in-progress: false

jobs:
  process-cutouts:
    name: Cut out waiting player photos (daily sweep for the rest)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      YATSTATS_S3_BUCKET: yatstats-assets
      DRY_RUN: "false"
      OVERWRITE: "false"
      MAX_FILES: ""
      SWEEP: ${{ github.event.schedule == '41 10 * * *' && 'true' || 'false' }}

    steps:
      # One listing of the marker folder; the AWS CLI is already on the runner.
      - name: Anything waiting?
        id: queue
        run: |
          # Check exactly one S3 service page; never let CLI pagination emit multiple values.
          if ! waiting=$(aws s3api list-objects-v2 --bucket "$YATSTATS_S3_BUCKET" --prefix cutout-queue/v1/ --max-keys 1 --no-paginate --query KeyCount --output text); then
            echo '::warning::Queue check failed; attempting marker processing instead.'
            waiting=1
          fi
          case "$waiting" in
            0|1) ;;
            *) echo '::warning::Unexpected queue count; attempting marker processing instead.'; waiting=1 ;;
          esac
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          echo "Photos waiting (first page): $waiting; daily sweep: $SWEEP"

      - name: Check out repository
        if: steps.queue.outputs.waiting != '0' || env.SWEEP == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.queue.outputs.waiting != '0' || env.SWEEP == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image processing dependencies
        if: steps.queue.outputs.waiting != '0' || env.SWEEP == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow rembg onnxruntime

      # rembg's background-removal model is downloaded once and reused.
      - name: Cache rembg model
        if: steps.queue.outputs.waiting != '0' || env.SWEEP == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-models

      - name: Waiting photos (marker queue only)
        if: steps.queue.outputs.waiting != '0'
        run: python scripts/process-cutout-queue-s3.py

      # Daily sweep: listing comparison only; touches only new/replaced photos.
      - name: Sweep HS flip-card front (players/then -> players/then-cutouts)
        if: env.SWEEP == 'true'
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/then/
          YATSTATS_S3_OUTPUT_PREFIX: players/then-cutouts/
          INCLUDE_SOURCE_PNG: "true"
        run: python scripts/process-player-cutouts-s3.py

      - name: Sweep flip-card back action photo (players/back -> players/back-cutouts)
        if: env.SWEEP == 'true'
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/back/
          YATSTATS_S3_OUTPUT_PREFIX: players/back-cutouts/
        run: python scripts/process-player-cutouts-s3.py

      - name: Sweep headshot (players/now -> players/now-cutouts)
        if: env.SWEEP == 'true'
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/now/
          YATSTATS_S3_OUTPUT_PREFIX: players/now-cutouts/
        run: python scripts/process-player-cutouts-s3.py

      - name: Sweep timeline hero (players/season-photos -> players/season-cutouts)
        if: env.SWEEP == 'true'
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/season-photos/
          YATSTATS_S3_OUTPUT_PREFIX: players/season-cutouts/
          INCLUDE_SOURCE_PNG: "true"
        run: python scripts/process-player-cutouts-s3.py
