name: Hourly Player Image Cutouts

# Every hour consume ONLY pending retry markers written when immediate upload
# cutout generation fails. Each queue is tiny relative to the source library;
# there is no listing of every previously uploaded player image.
# Historical backfills remain available via the explicit manual workflow.
#
# workflow_dispatch is kept for an ad-hoc manual run of the same four
# pairs; use the existing process-player-cutouts.yml instead for a
# one-off custom source/output prefix or a dry run.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: player-cutout-processing
  cancel-in-progress: false

jobs:
  process-cutouts:
    name: Process S3 player cutouts (then / back / now / timeline heroes)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      YATSTATS_S3_BUCKET: yatstats-assets
      DRY_RUN: "false"
      OVERWRITE: "false"
      MAX_FILES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image processing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow rembg onnxruntime

      # rembg's background-removal model (~1GB) is downloaded once to this
      # directory on first use and reused after that. Without caching it
      # across runs, every hour that has even one new image to process
      # would re-download the full model from scratch.
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-models

      # Output folders match what's actually on S3 and what the site reads
      # (ZoomableCareerTimeline / api/cutout): then-cutouts/, back-cutouts/,
      # now-cutouts/. The steps below used to still write to the pre-rename
      # names (cutouts/, now-cutouts/ for back photos, headshot-cutouts/),
      # so new uploads never reached the site and a back photo could land
      # in the headshot folder.
      - name: HS flip-card front (players/then -> players/then-cutouts)
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/then/
          YATSTATS_S3_OUTPUT_PREFIX: players/then-cutouts/
          INCLUDE_SOURCE_PNG: "true"
          PENDING_QUEUE_PREFIX: players/cutout-pending/then/
        run: python scripts/process-player-cutouts-s3.py

      - name: Flip-card back action photo (players/back -> players/back-cutouts)
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/back/
          YATSTATS_S3_OUTPUT_PREFIX: players/back-cutouts/
          PENDING_QUEUE_PREFIX: players/cutout-pending/back/
        run: python scripts/process-player-cutouts-s3.py

      - name: Headshot (players/now -> players/now-cutouts)
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/now/
          YATSTATS_S3_OUTPUT_PREFIX: players/now-cutouts/
          PENDING_QUEUE_PREFIX: players/cutout-pending/now/
        run: python scripts/process-player-cutouts-s3.py

      # Season/timeline legacy backfills are manual. Do not re-introduce
      # a scheduled full-prefix scan without an indexed upload queue.
