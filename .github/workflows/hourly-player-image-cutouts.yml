name: Hourly Player Image Cutouts

# Runs scripts/process-player-cutouts-s3.py against every raw-image folder
# that needs a transparent-PNG cutout counterpart, once an hour. Each
# folder is its own step so one failing (or simply having nothing new)
# never blocks the others. The script itself already skips any file that
# already has a generated output (see OVERWRITE), so re-running against
# the same folder every hour only ever costs a cheap S3 listing on the
# hours nothing new was uploaded -- rembg's background-removal model is
# only pulled down (and only then does real work happen) on an hour that
# actually has a new file to process.
#
# workflow_dispatch is kept for an ad-hoc manual run of the same three
# pairs; use the existing process-player-cutouts.yml instead for a
# one-off custom source/output prefix or a dry run.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  process-cutouts:
    name: Process S3 player cutouts (then / back / now)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      YATSTATS_S3_BUCKET: yatstats-assets
      DRY_RUN: "false"
      OVERWRITE: "false"
      MAX_FILES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image processing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow rembg onnxruntime

      # rembg's background-removal model (~1GB) is downloaded once to this
      # directory on first use and reused after that. Without caching it
      # across runs, every hour that has even one new image to process
      # would re-download the full model from scratch.
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-models

      - name: HS flip-card front (players/then -> players/cutouts)
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/then/
          YATSTATS_S3_OUTPUT_PREFIX: players/cutouts/
        run: python scripts/process-player-cutouts-s3.py

      - name: Career-timeline bridge photo (players/back -> players/now-cutouts)
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/back/
          YATSTATS_S3_OUTPUT_PREFIX: players/now-cutouts/
        run: python scripts/process-player-cutouts-s3.py

      - name: Headshot fallback (players/now -> players/headshot-cutouts)
        continue-on-error: true
        env:
          YATSTATS_S3_SOURCE_PREFIX: players/now/
          YATSTATS_S3_OUTPUT_PREFIX: players/headshot-cutouts/
        run: python scripts/process-player-cutouts-s3.py
