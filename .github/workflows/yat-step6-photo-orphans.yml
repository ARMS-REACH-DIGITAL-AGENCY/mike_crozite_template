name: YAT step 6 - photos no flip card shows (read-only)

# Pete, Nov 19 2026: list every player photo file in S3 that no flip card
# shows, with a link to each. Read-only: nothing is copied, moved or deleted.

on:
  workflow_dispatch:
  push:
    branches: [yat/step6-photo-orphans]
    paths: [.github/workflows/yat-step6-photo-orphans.yml, scripts/yat-step6-photo-orphans.py]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install boto3 "psycopg[binary]"
      - name: Photos no flip card shows
        run: python3 scripts/yat-step6-photo-orphans.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-not-shown
          path: photos-not-shown.csv
          if-no-files-found: ignore
