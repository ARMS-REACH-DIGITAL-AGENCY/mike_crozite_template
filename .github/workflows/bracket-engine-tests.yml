name: Bracket Engine Tests

on:
  workflow_dispatch:
  push:
    branches: [Easter-NEWS]
    paths:
      - src/lib/bracket/engine.ts
      - src/lib/bracket/engine.test.ts
      - src/lib/bracket/sweepstakesEntries.ts
      - src/lib/bracket/sweepstakesEntries.test.ts
      - src/components/bracket/liveSeason.ts
      - scripts/master-bracket-results.ts
      - scripts/master-bracket-clock.test.ts
      - scripts/master-bracket-national-seeding.test.ts
      - scripts/master-bracket-team-check.test.ts
      - scripts/test-bracket-daily-club-totals.cjs
      - scripts/bracket-results-job.test.ts
      - scripts/test-mlb-shared-ingestion.cjs
      - scripts/test-bracket-game-eligibility.cjs
      - src/lib/bracket/scheduleAuthority.ts
      - src/app/api/bracket/live/route.ts
      - src/lib/bracket/resultsJob.ts
      - src/lib/mlb/**
      - src/app/api/cron/bracket-results/route.ts
      - src/app/api/cron/mlb-live-gamelogs/route.ts
      - src/app/api/cron/live-schedule-refresh/route.ts
      - scripts/simulate-bracket-2026.ts
      - .github/workflows/bracket-engine-tests.yml
  pull_request:
    paths:
      - src/lib/bracket/engine.ts
      - src/lib/bracket/engine.test.ts
      - src/lib/bracket/sweepstakesEntries.ts
      - src/lib/bracket/sweepstakesEntries.test.ts
      - src/components/bracket/liveSeason.ts
      - scripts/master-bracket-results.ts
      - scripts/master-bracket-clock.test.ts
      - scripts/master-bracket-national-seeding.test.ts
      - scripts/master-bracket-team-check.test.ts
      - scripts/test-bracket-daily-club-totals.cjs
      - scripts/bracket-results-job.test.ts
      - scripts/test-mlb-shared-ingestion.cjs
      - scripts/test-bracket-game-eligibility.cjs
      - src/lib/bracket/scheduleAuthority.ts
      - src/app/api/bracket/live/route.ts
      - src/lib/bracket/resultsJob.ts
      - src/lib/mlb/**
      - src/app/api/cron/bracket-results/route.ts
      - src/app/api/cron/mlb-live-gamelogs/route.ts
      - src/app/api/cron/live-schedule-refresh/route.ts
      - src/lib/bracket/tournamentCalendar.ts
      - scripts/simulate-bracket-2026.ts
      - .github/workflows/bracket-engine-tests.yml

jobs:
  bracket-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run bracket engine tests
        run: |
          npx tsx --test src/lib/bracket/engine.test.ts src/lib/bracket/sweepstakesEntries.test.ts scripts/master-bracket-clock.test.ts scripts/master-bracket-national-seeding.test.ts scripts/master-bracket-team-check.test.ts scripts/bracket-results-job.test.ts
          node scripts/test-bracket-daily-club-totals.cjs
          node scripts/test-mlb-shared-ingestion.cjs
          node scripts/test-bracket-game-eligibility.cjs
