name: Bracket Engine Tests

on:
  workflow_dispatch:
  push:
    branches: [Easter-NEWS]
    paths:
      - src/lib/bracket/engine.ts
      - src/lib/bracket/engine.test.ts
      - scripts/simulate-bracket-2026.ts
      - .github/workflows/bracket-engine-tests.yml
  pull_request:
    paths:
      - src/lib/bracket/engine.ts
      - src/lib/bracket/engine.test.ts
      - src/lib/bracket/tournamentCalendar.ts
      - scripts/simulate-bracket-2026.ts
      - .github/workflows/bracket-engine-tests.yml

jobs:
  bracket-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run bracket engine tests
        run: npx tsx --test src/lib/bracket/engine.test.ts
