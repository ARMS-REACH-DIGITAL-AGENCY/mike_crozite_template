name: Backfill Verified Historical Team Logos
on:
  push:
    branches: [Easter-NEWS]
    paths:
      - "data/historical-team-logo-sources.csv"
      - "scripts/backfill-historical-team-logos.py"
      - ".github/workflows/backfill-historical-team-logos.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Audit without publishing"
        default: "true"
        required: false
        type: choice
        options: ["true", "false"]
permissions:
  contents: read
concurrency:
  group: historical-team-logo-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      YATSTATS_S3_BUCKET: yatstats-assets
      DRY_RUN: ${{ github.event_name == 'push' && 'false' || github.event.inputs.dry_run || 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install boto3 pillow
      - run: python scripts/backfill-historical-team-logos.py
