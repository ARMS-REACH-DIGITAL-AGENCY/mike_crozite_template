name: MLB Transactions Sync

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date (YYYY-MM-DD). Leave blank for the default 30-day rolling window."
        required: false
        type: string
      end_date:
        description: "Backfill end date (YYYY-MM-DD). Leave blank for the default 30-day rolling window."
        required: false
        type: string
  schedule:
    - cron: "10 */3 * * *"

jobs:
  sync-mlb-transactions:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout Easter-NEWS branch
        uses: actions/checkout@v4
        with:
          ref: Easter-NEWS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Confirm branch
        run: |
          git branch --show-current
          git rev-parse --short HEAD

      - name: Run MLB transactions sync
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start_date }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start_date }}"; fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then ARGS="$ARGS --end ${{ github.event.inputs.end_date }}"; fi
          npx tsx ./scripts/sync-mlb-transactions.ts $ARGS

      - name: Apply MLB transaction status to flip cards
        run: npx tsx ./scripts/apply-mlb-transaction-status.ts
