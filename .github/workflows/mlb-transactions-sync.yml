name: MLB Transactions Sync

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date (YYYY-MM-DD). Leave blank for the default 30-day rolling window."
        required: false
        type: string
      end_date:
        description: "Backfill end date (YYYY-MM-DD). Leave blank for the default 30-day rolling window."
        required: false
        type: string
  schedule:
    - cron: "*/15 * * * *"

jobs:
  sync-mlb-transactions:
    runs-on: ubuntu-latest

    # Needed only to start the MLB Roster Sync (last step).
    permissions:
      contents: read
      actions: write

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout Easter-NEWS branch
        uses: actions/checkout@v4
        with:
          ref: Easter-NEWS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Confirm branch
        run: |
          git branch --show-current
          git rev-parse --short HEAD

      - name: Run MLB transactions sync
        env:
          # Never interpolate ${{ }} expressions directly into a run: script —
          # workflow_dispatch inputs are attacker-controllable in the general
          # GitHub Actions threat model, and a crafted value spliced into the
          # command text executes as shell, not data, with DATABASE_URL in
          # scope. Routing through env: makes the value a plain string that
          # bash can only ever read, never execute.
          START_DATE_INPUT: ${{ github.event.inputs.start_date }}
          END_DATE_INPUT: ${{ github.event.inputs.end_date }}
        run: |
          DATE_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          ARGS=()
          if [ -n "$START_DATE_INPUT" ]; then
            if ! [[ "$START_DATE_INPUT" =~ $DATE_RE ]]; then
              echo "::error::start_date must be YYYY-MM-DD, got: $START_DATE_INPUT"
              exit 1
            fi
            ARGS+=(--start "$START_DATE_INPUT")
          fi
          if [ -n "$END_DATE_INPUT" ]; then
            if ! [[ "$END_DATE_INPUT" =~ $DATE_RE ]]; then
              echo "::error::end_date must be YYYY-MM-DD, got: $END_DATE_INPUT"
              exit 1
            fi
            ARGS+=(--end "$END_DATE_INPUT")
          fi
          npx tsx ./scripts/sync-mlb-transactions.ts "${ARGS[@]}"

      - name: Apply MLB transaction status to flip cards
        # Even a partial or failed MLB API fetch must not strand previously
        # imported, verified transactions in player_transactions. Preserve
        # the sync failure as a failed workflow while still reconciling the
        # last authoritative transactions already stored in Neon.
        if: ${{ !cancelled() }}
        run: npx tsx ./scripts/apply-mlb-transaction-status.ts

      # Pete, Nov 18 2026 (CLAUDE.md "The MLB feed is the authority"): a new MLB
      # move must reach the card right away, not at the next roster sync hours
      # later. The roster sync reads each player's current team and status from
      # MLB itself; start it whenever a move for a card player arrived after
      # its last completed run. Its concurrency group keeps at most one waiting.
      - name: Start the roster sync when new MLB moves arrived
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          moves=$(npx tsx ./scripts/mlb-moves-since-roster-sync.ts)
          if [ "${moves:-0}" -gt 0 ]; then
            gh workflow run mlb_roster-sync.yml --repo "$GITHUB_REPOSITORY" --ref Easter-NEWS
            echo "Started MLB Roster Sync for $moves new move(s)."
          else
            echo "No new MLB moves since the last roster sync."
          fi
