name: TBC Safe Ingest v2

on:
  workflow_dispatch:
    inputs:
      feeds:
        description: "Comma-separated feeds to ingest"
        required: false
        default: "batting,pitching"
      optional_feeds:
        description: "Feeds allowed to fail without failing the whole workflow"
        required: false
        default: "players"
      year:
        description: "Year filter for batting/pitching"
        required: false
        default: "2026"
  schedule:
    - cron: "15 7 * * *"

jobs:
  ingest-tbc-safe-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TBC_FEED_PASSWORD: ${{ secrets.TBC_FEED_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg[binary]

      - name: Resolve inputs
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "feeds=${{ github.event.inputs.feeds }}" >> "$GITHUB_OUTPUT"
            echo "optional_feeds=${{ github.event.inputs.optional_feeds }}" >> "$GITHUB_OUTPUT"
            echo "year=${{ github.event.inputs.year }}" >> "$GITHUB_OUTPUT"
          else
            echo "feeds=batting,pitching" >> "$GITHUB_OUTPUT"
            echo "optional_feeds=players" >> "$GITHUB_OUTPUT"
            echo "year=2026" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TBC snapshot ingest
        run: |
          python scripts/ingest_tbc_safe_v2.py \
            --feeds "${{ steps.vars.outputs.feeds }}" \
            --optional-feeds "${{ steps.vars.outputs.optional_feeds }}" \
            --year "${{ steps.vars.outputs.year }}"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Promote snapshots to canonical tables
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/011_promote_tbc_snapshots.sql
