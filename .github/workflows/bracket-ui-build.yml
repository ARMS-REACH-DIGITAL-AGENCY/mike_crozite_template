name: Bracket UI Build

on:
  push:
    branches: [bracket-simulation]
    paths:
      - src/components/bracket/**
      - src/app/api/player-identities/**
      - src/lib/bracket/**
      - .github/workflows/bracket-ui-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
