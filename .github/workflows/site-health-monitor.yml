name: YATSTATS Production Health Monitor

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: yatstats-production-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check representative production school sites
        id: check
        continue-on-error: true
        run: python3 scripts/check-site-health.py
      - name: Upload complete health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microsite-health-report
          path: site-health-report.json
          if-no-files-found: warn
      - name: Open or update health incident
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --state open --search 'YATSTATS production health alert in:title' --json number --jq '.[0].number // empty')
          body="Automated production smoke checks failed. Review this run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Checks cover the full 1,020-URL Neon-derived production microsite inventory. No data was modified."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "YATSTATS production health alert" --body "$body"
          fi
      - name: Resolve incident after recovery
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --state open --search 'YATSTATS production health alert in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Representative production school checks recovered. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
      - name: Mark run failed on unhealthy result
        if: steps.check.outcome == 'failure'
        run: exit 1
