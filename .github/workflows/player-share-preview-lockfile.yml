name: Refresh player share screenshot lockfile
on:
  push:
    branches:
      - fix/player-share-real-timeline-crop-20261021
    paths:
      - package.json
      - .github/workflows/player-share-preview-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve dependencies with pnpm
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit updated lockfile to preview branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: lock screenshot browser dependencies"
          git fetch origin fix/player-share-real-timeline-crop-20261021
          git rebase origin/fix/player-share-real-timeline-crop-20261021
          git push origin HEAD:fix/player-share-real-timeline-crop-20261021
