name: Process Player Cutouts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan only; do not create/update generated PNG cutouts"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      overwrite:
        description: "Overwrite generated PNG outputs only; original JPG/JPEG/WEBP files are never overwritten"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_files:
        description: "Optional max files to process/test. Leave blank for all."
        required: false
        default: ""
      source_prefix:
        description: "S3 source prefix containing original JPG/JPEG/WEBP files"
        required: false
        default: "players/cutouts/"
      output_prefix:
        description: "S3 output prefix for generated transparent PNG cutouts"
        required: false
        default: "players/cutouts/"

jobs:
  process-cutouts:
    name: Process S3 player cutouts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      YATSTATS_S3_BUCKET: yatstats-assets
      YATSTATS_S3_SOURCE_PREFIX: ${{ github.event.inputs.source_prefix || 'players/cutouts/' }}
      YATSTATS_S3_OUTPUT_PREFIX: ${{ github.event.inputs.output_prefix || 'players/cutouts/' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      OVERWRITE: ${{ github.event.inputs.overwrite || 'false' }}
      MAX_FILES: ${{ github.event.inputs.max_files || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image processing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow rembg onnxruntime

      - name: Process player cutouts from S3
        run: python scripts/process-player-cutouts-s3.py
