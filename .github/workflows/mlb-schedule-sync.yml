name: MLB/MiLB Full Schedule Sync

on:
  workflow_dispatch:
  schedule:
    # 2:00 AM Arizona time = 09:00 UTC
    - cron: "0 9 * * *"

jobs:
  sync-mlb-schedules:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout Easter-NEWS branch
        uses: actions/checkout@v4
        with:
          ref: Easter-NEWS

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests psycopg[binary]

      - name: Confirm branch
        run: |
          git branch --show-current
          git rev-parse --short HEAD

      - name: Run full MLB/MiLB schedule sync
        run: python scripts/sync_mlb_schedules.py
