name: Build Web Cutouts

# Turns the player cutout PNGs into small, display-ready WebP files the
# profile page loads straight from S3 (see scripts/build-web-cutouts-s3.py):
#   players/then-cutouts/ -> players/then-web/
#   players/back-cutouts/ -> players/back-web/
#   players/now-cutouts/  -> players/now-web/
# plus card-size copies of the original photos for the gallery flip cards:
#   players/then/ -> players/then-card/   players/back/ -> players/back-card/
#   players/now/  -> players/now-thumb/
# Runs at :30 each hour, after the :00 Hourly Player Image Cutouts job has
# had time to add new cutouts. Only missing or out-of-date web files are
# built, so a quiet hour costs just two S3 listings per folder.
#
# Manual runs default to a dry run. Use max_files / only_ids to test on a
# few players before a full run.

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be built without writing to S3"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      overwrite:
        description: "Rebuild web files even when they're up to date"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      kinds:
        description: "Which outputs to build (comma-separated: then,back,now,then-card,back-card,now-thumb)"
        required: false
        default: "then,back,now,then-card,back-card,now-thumb"
      max_files:
        description: "Optional max files per folder. Leave blank for all."
        required: false
        default: ""
      only_ids:
        description: "Optional comma-separated player ids to process"
        required: false
        default: ""

# Never two runs writing the same files at once; a long run finishes
# before the next hour's starts.
concurrency:
  group: build-web-cutouts
  cancel-in-progress: false

jobs:
  build:
    name: Build WebP cutouts on S3
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      YATSTATS_S3_BUCKET: yatstats-assets
      # Scheduled runs write; manual runs follow the dry_run input.
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
      OVERWRITE: ${{ github.event.inputs.overwrite || 'false' }}
      KINDS: ${{ github.event.inputs.kinds || 'then,back,now,then-card,back-card,now-thumb' }}
      MAX_FILES: ${{ github.event.inputs.max_files || '' }}
      ONLY_IDS: ${{ github.event.inputs.only_ids || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow

      - name: Build web cutouts
        run: python scripts/build-web-cutouts-s3.py
