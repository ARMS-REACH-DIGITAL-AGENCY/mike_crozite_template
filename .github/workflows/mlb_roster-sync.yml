name: MLB Roster Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  sync-mlb-rosters:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout Easter-NEWS branch
        uses: actions/checkout@v4
        with:
          ref: Easter-NEWS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Confirm branch
        run: |
          git branch --show-current
          git rev-parse --short HEAD

      - name: Run MLB roster raw sync
        run: npx tsx ./scripts/sync-mlb-full-org-rosters.ts

      - name: Refresh flip card front stage from MLB raw
        run: npx tsx ./scripts/refresh-flip-card-front-stage-from-mlb.ts
