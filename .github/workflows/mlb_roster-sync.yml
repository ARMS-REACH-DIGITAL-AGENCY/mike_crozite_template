name: MLB Roster Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to DB"
        required: true
        default: "false"
      season:
        description: "Season (optional)"
        required: false
        default: ""
  schedule:
    - cron: "0 */3 * * *"

jobs:
  sync-mlb-rosters:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run MLB roster sync
        run: |
          CMD="npx tsx ./scripts/sync-mlb-full-org-rosters.ts"
          if [ -n "${{ github.event.inputs.season }}" ]; then
            CMD="$CMD --season ${{ github.event.inputs.season }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          eval $CMD
