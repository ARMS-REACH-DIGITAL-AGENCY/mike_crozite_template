name: Refresh Prepared School URL Directory

on:
  workflow_dispatch:
  schedule:
    # After the TBC import windows, without reading/writing production page data.
    - cron: '10 0,12 * * *'

permissions:
  contents: read

concurrency:
  group: prepared-school-url-directory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: Easter-NEWS
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependencies
        run: npm ci --ignore-scripts
      - name: Refresh validated school directory atomically
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/refresh-school-url-directory.cjs --apply
