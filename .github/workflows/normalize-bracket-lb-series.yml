name: Normalize 2026 leaderboard series

on:
  push:
    branches: [bracket-simulation]
    paths:
      - scripts/normalize-bracket-lb-series.ts
      - .github/workflows/normalize-bracket-lb-series.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bracket-simulation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsx scripts/normalize-bracket-lb-series.ts
      - name: Commit normalized simulation fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bracket-lab/2026/lb.json public/bracket-lab/2026/d-lb-*.json
          if git diff --cached --quiet; then
            echo "No fixture changes"
          else
            git commit -m "Bracket fixture: keep one opponent for each 3-game leaderboard round"
            git push origin HEAD:bracket-simulation
          fi
