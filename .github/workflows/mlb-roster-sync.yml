name: MLB Roster Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  sync-mlb-rosters:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run MLB roster sync
       run: npx tsx ./scripts/sync-mlb-full-org-rosters.ts
